spring.application.name=ms-canchas
server.port=8080

# El esquema lo manda el DDL versionado en infra/postgres/. Si la entidad no calza,
# se corrige la entidad, nunca el DDL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/canchas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:canchas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:canchas_pass}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Secreto compartido por los cuatro microservicios. ms-canchas solo valida el token:
# no lo emite, por eso no declara jwt.vigencia-horas.
jwt.secret=${JWT_SECRET}

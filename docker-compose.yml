services:
  postgres:
    image: postgres:16-alpine
    container_name: canchas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/02-ddl-usuarios.sql:/docker-entrypoint-initdb.d/02-ddl-usuarios.sql:ro
      - ./infra/postgres/03-ddl-canchas.sql:/docker-entrypoint-initdb.d/03-ddl-canchas.sql:ro
      - ./infra/postgres/04-ddl-reservas.sql:/docker-entrypoint-initdb.d/04-ddl-reservas.sql:ro
      - ./infra/postgres/05-seed.sql:/docker-entrypoint-initdb.d/05-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # pg_isready responde OK mientras aun corren los scripts de docker-entrypoint-initdb.d;
      # la sonda solo pasa cuando el seed ya cargo el usuario ADMIN, o sea al final del init.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d usuarios_db -tAc \"SELECT 1 FROM usuario WHERE rol = 'ADMIN' LIMIT 1\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: canchas-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

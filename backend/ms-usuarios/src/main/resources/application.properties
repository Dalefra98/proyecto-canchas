spring.application.name=ms-usuarios
server.port=8080

# El esquema lo manda el DDL versionado en infra/postgres/. Si la entidad no calza,
# se corrige la entidad, nunca el DDL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/usuarios_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:usuarios_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:usuarios_pass}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Secreto compartido por los cuatro microservicios para firmar y validar el JWT HS256.
jwt.secret=${JWT_SECRET}
jwt.vigencia-horas=8

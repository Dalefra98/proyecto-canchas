services:
  postgres:
    image: postgres:16-alpine
    container_name: canchas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/02-ddl-usuarios.sql:/docker-entrypoint-initdb.d/02-ddl-usuarios.sql:ro
      - ./infra/postgres/03-ddl-canchas.sql:/docker-entrypoint-initdb.d/03-ddl-canchas.sql:ro
      - ./infra/postgres/04-ddl-reservas.sql:/docker-entrypoint-initdb.d/04-ddl-reservas.sql:ro
      - ./infra/postgres/05-seed.sql:/docker-entrypoint-initdb.d/05-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # pg_isready responde OK mientras aun corren los scripts de docker-entrypoint-initdb.d;
      # la sonda solo pasa cuando el seed ya cargo el usuario ADMIN, o sea al final del init.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d usuarios_db -tAc \"SELECT 1 FROM usuario WHERE rol = 'ADMIN' LIMIT 1\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-usuarios:
    build: ./backend/ms-usuarios
    container_name: canchas-ms-usuarios
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: usuarios_user
      SPRING_DATASOURCE_PASSWORD: usuarios_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
    ports:
      # Puerto de servicio, se conserva a proposito (spec 10, D-2): Swagger UI vive fuera
      # de /api y el gateway no lo enruta, y toda la verificacion por curl.exe de las
      # specs 03 a 05 y de la bitacora esta escrita contra estos puertos. La aplicacion
      # NO los usa: los cuatro microfrontends llaman a la API por gateway:80.
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ms-canchas:
    build: ./backend/ms-canchas
    container_name: canchas-ms-canchas
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/canchas_db
      SPRING_DATASOURCE_USERNAME: canchas_user
      SPRING_DATASOURCE_PASSWORD: canchas_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
    ports:
      # Puerto de servicio, se conserva a proposito (spec 10, D-2): Swagger UI vive fuera
      # de /api y el gateway no lo enruta, y toda la verificacion por curl.exe de las
      # specs 03 a 05 y de la bitacora esta escrita contra estos puertos. La aplicacion
      # NO los usa: los cuatro microfrontends llaman a la API por gateway:80.
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ms-reservas:
    build: ./backend/ms-reservas
    container_name: canchas-ms-reservas
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservas_db
      SPRING_DATASOURCE_USERNAME: reservas_user
      SPRING_DATASOURCE_PASSWORD: reservas_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      # Nombre de contenedor: la llamada a ms-canchas es servidor a servidor.
      MS_CANCHAS_URL: http://ms-canchas:8080
      RESERVAS_MAX_ACTIVAS: ${RESERVAS_MAX_ACTIVAS}
    ports:
      # Puerto de servicio, se conserva a proposito (spec 10, D-2): Swagger UI vive fuera
      # de /api y el gateway no lo enruta, y toda la verificacion por curl.exe de las
      # specs 03 a 05 y de la bitacora esta escrita contra estos puertos. La aplicacion
      # NO los usa: los cuatro microfrontends llaman a la API por gateway:80.
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ms-canchas:
        condition: service_started

  ms-reportes:
    build: ./backend/ms-reportes
    container_name: canchas-ms-reportes
    environment:
      # Sin SPRING_DATASOURCE_*: ms-reportes no tiene base de datos propia. Consume
      # ms-canchas y ms-reservas por HTTP (CLAUDE.md seccion 3).
      JWT_SECRET: ${JWT_SECRET}
      MS_CANCHAS_URL: http://ms-canchas:8080
      MS_RESERVAS_URL: http://ms-reservas:8080
    ports:
      # Puerto de servicio, se conserva a proposito (spec 10, D-2): Swagger UI vive fuera
      # de /api y el gateway no lo enruta, y toda la verificacion por curl.exe de las
      # specs 03 a 05 y de la bitacora esta escrita contra estos puertos. La aplicacion
      # NO los usa: los cuatro microfrontends llaman a la API por gateway:80.
      - "8085:8080"
    depends_on:
      ms-canchas:
        condition: service_started
      ms-reservas:
        condition: service_started

  gateway:
    # Gateway Nginx (spec 10): punto de entrada unico del trafico /api de la aplicacion.
    # El reparto por microservicio vive en infra/nginx/gateway.conf y en ningun otro lado.
    # Sin build ni Dockerfile: la imagen oficial mas la configuracion montada bastan.
    image: nginx:alpine
    container_name: canchas-gateway
    volumes:
      # Se monta en la ruta de default.conf, NO como un archivo mas de conf.d (DD-01):
      # la imagen trae su propio default.conf con un server que ya escucha en el puerto
      # 80 y, con los dos presentes, ganaria el primero por orden alfabetico y los cuatro
      # location /api no se usarian nunca, sin ningun error visible.
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Puerto de verificacion y demostracion (D-7), NO la via de la aplicacion: los
      # cuatro microfrontends llaman al gateway por la red interna de Docker,
      # http://gateway:80. 8090 y no 8080 (DD-13): 8080 es el puerto mas disputado de una
      # maquina de desarrollo y el proyecto no debe depender de que este libre.
      - "8090:80"
    depends_on:
      # Nginx resuelve por DNS el nombre de cada proxy_pass AL ARRANCAR, no en cada
      # peticion: si un contenedor destino no existe todavia, aborta con
      # "host not found in upstream". service_started basta -el contenedor existe y el
      # DNS de Docker resuelve- y service_healthy es imposible: ninguno de los cuatro
      # microservicios declara healthcheck.
      ms-usuarios:
        condition: service_started
      ms-canchas:
        condition: service_started
      ms-reservas:
        condition: service_started
      ms-reportes:
        condition: service_started

  adminer:
    image: adminer:4
    container_name: canchas-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  shell:
    # Sin build ni Dockerfile: webpack serve necesita el codigo vivo, montado por
    # volumen, para recompilar al guardar (design D-03).
    image: node:20-alpine
    container_name: canchas-shell
    working_dir: /app
    command: sh -c "npm install && npx webpack serve --mode development"
    volumes:
      - ./frontend/shell:/app
      # Volumen anonimo: sin el, el node_modules inexistente del host tapa el
      # que instala el contenedor.
      - shell_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      # Este frontend ya no habla con ningun microservicio: su devServer proxya /api al
      # gateway y solo a el (spec 10), asi que declarar los ms- aqui seria declarar una
      # dependencia falsa. El orden hacia los microservicios se mantiene por
      # transitividad, porque el gateway si depende de los cuatro.
      # Que consume realmente este microfrontend se lee en los context de su
      # devServer.proxy, en webpack.config.js, no aqui (D-8).
      # service_started y no service_healthy: el gateway no declara healthcheck y el
      # devServer arranca igual aunque el destino no responda.
      gateway:
        condition: service_started

  mf-reservas:
    # Mismo patron del servicio shell (P-07): webpack serve necesita el codigo
    # vivo, montado por volumen, para recompilar al guardar.
    image: node:20-alpine
    container_name: canchas-mf-reservas
    working_dir: /app
    command: sh -c "npm install && npx webpack serve --mode development"
    volumes:
      - ./frontend/mf-reservas:/app
      # Volumen anonimo: sin el, el node_modules inexistente del host tapa el
      # que instala el contenedor.
      - mf_reservas_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      # Este remote ya no habla con ningun microservicio: su devServer proxya /api al
      # gateway y solo a el (spec 10). Que consume realmente -GET /api/canchas y las
      # cuatro rutas de /api/reservas, P-07- se lee en los context de su
      # devServer.proxy, en webpack.config.js, no aqui (D-8).
      # service_started porque el gateway no declara healthcheck y el devServer
      # arranca igual.
      gateway:
        condition: service_started

  mf-administracion:
    # Mismo patron de los servicios shell y mf-reservas: webpack serve necesita
    # el codigo vivo, montado por volumen, para recompilar al guardar.
    image: node:20-alpine
    container_name: canchas-mf-administracion
    working_dir: /app
    command: sh -c "npm install && npx webpack serve --mode development"
    volumes:
      - ./frontend/mf-administracion:/app
      # Volumen anonimo: sin el, el node_modules inexistente del host tapa el
      # que instala el contenedor.
      - mf_administracion_node_modules:/app/node_modules
    ports:
      - "3002:3002"
    depends_on:
      # Este remote ya no habla con ningun microservicio: su devServer proxya /api al
      # gateway y solo a el (spec 10). Que consume realmente -/api/usuarios,
      # /api/canchas y /api/reservas, P-08, y no /api/reportes- se lee en los tres
      # context de su devServer.proxy, en webpack.config.js, no aqui (D-8, DD-14).
      # service_started porque el gateway no declara healthcheck y el devServer
      # arranca igual.
      gateway:
        condition: service_started

  mf-reportes:
    # Mismo patron de los servicios shell, mf-reservas y mf-administracion:
    # webpack serve necesita el codigo vivo, montado por volumen, para
    # recompilar al guardar.
    image: node:20-alpine
    container_name: canchas-mf-reportes
    working_dir: /app
    command: sh -c "npm install && npx webpack serve --mode development"
    volumes:
      - ./frontend/mf-reportes:/app
      # Volumen anonimo: sin el, el node_modules inexistente del host tapa el
      # que instala el contenedor.
      - mf_reportes_node_modules:/app/node_modules
    ports:
      - "3003:3003"
    depends_on:
      # Este remote ya no habla con ningun microservicio: su devServer proxya /api al
      # gateway y solo a el (spec 10). Que consume unicamente /api/reportes -P-08, y
      # D-15 de la spec 09- se lee en la unica entrada de su devServer.proxy, en
      # webpack.config.js, no aqui (D-8).
      # service_started porque el gateway no declara healthcheck y el devServer
      # arranca igual.
      gateway:
        condition: service_started

volumes:
  pgdata:
  shell_node_modules:
  mf_reservas_node_modules:
  mf_administracion_node_modules:
  mf_reportes_node_modules:

spring.application.name=ms-reportes
server.port=8080

# Sin spring.datasource.* ni spring.jpa.*: ms-reportes no tiene base de datos propia
# (CLAUDE.md seccion 3, design D-01). Toda su informacion llega por HTTP de ms-canchas y
# ms-reservas.

# Secreto compartido por los cuatro microservicios. Con el se valida el token entrante
# emitido por ms-usuarios y se firma el token de servicio saliente.
jwt.secret=${JWT_SECRET}

# Token de servicio para las llamadas internas: rol SERVICIO, sin claim sub.
reportes.token-servicio.duracion=5m

# Clientes HTTP. Las URLs son nombres de contenedor: son llamadas servidor a servidor,
# no del navegador. Sin reintentos (design D-06 de la spec 04, heredado).
mscanchas.url=${MS_CANCHAS_URL:http://ms-canchas:8080}
mscanchas.timeout.conexion=2s
mscanchas.timeout.lectura=5s

msreservas.url=${MS_RESERVAS_URL:http://ms-reservas:8080}
msreservas.timeout.conexion=2s
msreservas.timeout.lectura=5s

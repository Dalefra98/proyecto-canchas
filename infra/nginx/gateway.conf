# Gateway Nginx del proyecto (spec 10). Punto de entrada unico del trafico /api de la
# aplicacion: los cuatro microfrontends proxyan aqui y este archivo es el unico lugar
# donde vive el reparto por microservicio.
#
# Montaje: se monta en /etc/nginx/conf.d/default.conf, NO como un archivo mas de conf.d
# (DD-01). La imagen nginx:alpine trae su propio default.conf con un server que ya
# escucha en el puerto 80: con los dos presentes habria dos server en la misma escucha
# sin server_name, ganaria el primero por orden alfabetico -default.conf- y los cuatro
# location /api no se usarian nunca, sin ningun error visible.

server {
    listen 80;

    # Los cuatro location siguientes son identicos salvo el destino.
    #
    # proxy_pass SIN barra final ni ruta (R-1, DD-02): asi el microservicio recibe la
    # ruta integra, prefijo incluido. Con barra, nginx sustituiria el prefijo coincidente
    # y ms-canchas recibiria /{canchaId} en vez de /api/canchas/{canchaId}, que es la
    # ruta que declaran sus controladores: responderia 404 a todo.
    #
    # La seleccion entre los cinco location la hace nginx por prefijo mas largo, no por
    # orden en el archivo (R-4): el orden de abajo es solo por legibilidad.
    #
    # Authorization, Content-Type, Accept y el cuerpo de la peticion NO se tocan: nginx
    # los reenvia por omision y ninguna directiva los altera. Si el Bearer se perdiera,
    # los cuatro filtros JWT responderian 401 y la aplicacion entera dejaria de funcionar.

    location /api/usuarios {
        proxy_pass http://ms-usuarios:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/canchas {
        proxy_pass http://ms-canchas:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/reservas {
        proxy_pass http://ms-reservas:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/reportes {
        proxy_pass http://ms-reportes:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo que no es /api/<dominio> (DD-04). El 404 explicito es lo que hace
    # comprobable el alcance del gateway: sin este bloque, / devolveria la pagina de
    # bienvenida de nginx y pareceria que el gateway funciona cuando no enruto nada.
    # Swagger UI (D-3), los estaticos de los microfrontends (D-1) y adminer (D-4) se
    # acceden por sus puertos directos, no por aqui.
    location / {
        return 404;
    }
}

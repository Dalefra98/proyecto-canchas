spring.application.name=ms-reservas
server.port=8080

# El esquema lo manda el DDL versionado en infra/postgres/. Si la entidad no calza,
# se corrige la entidad, nunca el DDL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/reservas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reservas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reservas_pass}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Secreto compartido por los cuatro microservicios. Con el se valida el token entrante
# emitido por ms-usuarios y se firma el token de servicio saliente hacia ms-canchas.
jwt.secret=${JWT_SECRET}

# Token de servicio para las llamadas internas (design D-01): rol SERVICIO, sin claim sub.
reservas.token-servicio.duracion=5m

# Cliente HTTP hacia ms-canchas. La URL es el nombre del contenedor: es una llamada
# servidor a servidor, no del navegador. Sin reintentos (design D-06).
mscanchas.url=${MS_CANCHAS_URL:http://ms-canchas:8080}
mscanchas.timeout.conexion=2s
mscanchas.timeout.lectura=5s

# RN-06: limite configurable de reservas activas simultaneas por usuario.
reservas.max-activas=${RESERVAS_MAX_ACTIVAS:3}
